name: Build Universal Host and Modules

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"
        cache: gradle
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build APK
      run: ./gradlew assembleDebug
    - name: Prepare Modules Directory
      run: mkdir -p output_modules
    - name: Compile Modules to DEX
      shell: bash
      run: |
        set -euo pipefail
        ANDROID_JAR="$(find "$ANDROID_SDK_ROOT/platforms" -name android.jar | sort | tail -n 1)"
        D8_TOOL="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name d8 | sort | tail -n 1)"
        APP_CLASSES="app/build/tmp/kotlin-classes/debug:app/build/intermediates/javac/debug/classes"
        test -f "$ANDROID_JAR"
        test -f "$D8_TOOL"
        shopt -s nullglob
        for f in modules/*.java; do
          filename="$(basename "$f" .java)"
          workdir="$(mktemp -d)"
          echo "Building module: $filename"
          mkdir -p "$workdir/classes" "$workdir/dex"
          javac -source 8 -target 8 -d "$workdir/classes" -cp "$ANDROID_JAR:$APP_CLASSES" "$f"
          "$D8_TOOL" --min-api 24 --output "$workdir/dex" "$workdir/classes"/*.class
          mv "$workdir/dex/classes.dex" "output_modules/${filename}.dex"
          rm -rf "$workdir"
        done
        test -n "$(find output_modules -type f -name "*.dex" -print -quit)"
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
    - name: Upload Modules
      uses: actions/upload-artifact@v4
      with:
        name: dex-modules
        path: output_modules/*.dex
        if-no-files-found: error