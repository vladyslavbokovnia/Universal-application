name: Build Universal Host and Modules

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleDebug

    - name: Prepare Modules Directory
      run: mkdir -p output_modules

    - name: Compile Modules to DEX
      run: |
        # Находим путь к android.jar
        ANDROID_JAR=$(find $ANDROID_SDK_ROOT/platforms -name "android.jar" | head -n 1)
        # Путь к d8
        D8_TOOL=$(find $ANDROID_SDK_ROOT/build-tools -name "d8" | head -n 1)
        # Путь к скомпилированным классам IPlugin
        APP_CLASSES="app/build/tmp/kotlin-classes/debug:app/build/intermediates/javac/debug/classes"
        
        for f in modules/*.java; do
          if [ -f "$f" ]; then
            filename=$(basename "$f" .java)
            echo "Building module: $filename"
            
            # 1. Компилируем Java код модуля (форсируем Java 8 для совместимости с d8)
            javac -source 8 -target 8 -cp "$ANDROID_JAR:$APP_CLASSES" "$f"
            
            # 2. Создаем временную папку для d8
            mkdir -p "temp_${filename}"
            
            # 3. Конвертируем в DEX
            $D8_TOOL --output "temp_${filename}/" modules/*.class
            
            # 4. Переименовываем и перемещаем в итоговую папку
            mv "temp_${filename}/classes.dex" "output_modules/${filename}.dex"
            
            # 5. Очистка
            rm -rf "temp_${filename}"
            rm modules/*.class
          fi
        done

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk

    - name: Upload Modules
      uses: actions/upload-artifact@v4
      with:
        name: dex-modules
        path: output_modules/*.dex
