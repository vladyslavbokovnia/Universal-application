name: Build Universal Host and Modules

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: "17"
        distribution: "temurin"
        cache: gradle
    # Decode the persistent key to the exact path explicitly selected in app/build.gradle.
    - name: Install persistent debug signing key
      shell: bash
      run: |
        set -euo pipefail
        base64 -d ci/debug.keystore.b64 > ci/debug.keystore
        keytool -list -keystore ci/debug.keystore -storepass android | grep -i 'androiddebugkey'
    # Значок хоста: из плашки вырезается буква U (светящиеся линии на тёмной полупрозрачной заливке, фон прозрачный).
    - name: Cut host icon
      shell: bash
      run: |
        set -euo pipefail
        python3 -m pip install --quiet pillow numpy scipy
        python3 ci/make_icon.py
    # Хэш исходников хоста (без модулей и без зависимостей dep-newpipe, dep-uhm): кладётся в приложение (assets) и в релиз.
    # Приложение сравнивает свой хэш с хэшем в релизе и по точке у стрелки обновления показывает, нужно ли ставить новый APK.
    # dep-api входит в хэш: общие интерфейсы вшиты в хост.
    - name: Stamp host source hash
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p app/src/main/assets
        git ls-files -z app dep-api ci build.gradle settings.gradle gradle.properties \
          | xargs -0 sha256sum | sha256sum | cut -d' ' -f1 | tr -d '\n' > host_hash.txt
        cp host_hash.txt app/src/main/assets/host_hash.txt
        echo "Host source hash: $(cat host_hash.txt)"
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    # Одна сборка делает сразу всё: app-debug.apk, dep-newpipe-debug.apk и dep-uhm-debug.apk (контейнеры зависимостей).
    - name: Build APK and dependency containers
      run: ./gradlew assembleDebug
    - name: Check dependency containers
      shell: bash
      run: |
        set -euo pipefail
        for d in newpipe uhm; do
          f="dep-$d/build/outputs/apk/debug/dep-$d-debug.apk"
          test -f "$f"
          ls -l "$f"
          unzip -l "$f" | grep -E 'classes[0-9]*\.dex|lib/' || true
        done
    - name: Prepare Modules Directory
      run: mkdir -p output_modules
    - name: Compile Modules to DEX
      shell: bash
      run: |
        set -uo pipefail
        ANDROID_JAR="$(find "$ANDROID_SDK_ROOT/platforms" -name android.jar | sort | tail -n 1)"
        D8_TOOL="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name d8 | sort | tail -n 1)"
        APP_CLASSES="app/build/tmp/kotlin-classes/debug:app/build/intermediates/javac/debug/compileDebugJavaWithJavac/classes:app/build/intermediates/javac/debug/classes"
        test -f "$ANDROID_JAR"
        test -f "$D8_TOOL"
        shopt -s nullglob
        fail=0
        for f in modules/*.java; do
          filename="$(basename "$f" .java)"
          workdir="$(mktemp -d)"
          echo "Building module: $filename"
          mkdir -p "$workdir/classes" "$workdir/dex"
          out="$( { javac -source 8 -target 8 -d "$workdir/classes" -cp "$ANDROID_JAR:$APP_CLASSES" "$f" && "$D8_TOOL" --min-api 24 --lib "$ANDROID_JAR" --output "$workdir/dex" $(find "$workdir/classes" -name '*.class'); } 2>&1 )" || {
            echo "$out"
            msg="$(printf '%s' "$out" | head -c 6000 | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g')"
            echo "::error title=Module ${filename} failed::${msg}"
            fail=1
            rm -rf "$workdir"
            continue
          }
          mv "$workdir/dex/classes.dex" "output_modules/${filename}.dex"
          rm -rf "$workdir"
        done
        test "$fail" -eq 0
        test -n "$(find output_modules -type f -name "*.dex" -print -quit)"
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        if-no-files-found: error
    - name: Upload Modules
      uses: actions/upload-artifact@v4
      with:
        name: dex-modules
        path: output_modules/*.dex
        if-no-files-found: error
    - name: Upload dependency containers
      uses: actions/upload-artifact@v4
      with:
        name: dep-apks
        path: |
          dep-newpipe/build/outputs/apk/debug/dep-newpipe-debug.apk
          dep-uhm/build/outputs/apk/debug/dep-uhm-debug.apk
        if-no-files-found: error
    # Страница релиза «Latest build»: APK, архив modules.zip, каждый модуль отдельным файлом .dex
    # и зависимости dep-newpipe.apk, dep-uhm.apk (приложение само скачивает их в files/deps), скачивается без входа в GitHub.
    # Релиз пересоздаётся при каждой сборке main.
    - name: Publish release with APK and modules
      if: github.ref == 'refs/heads/main'
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p release_files
        cp app/build/outputs/apk/debug/app-debug.apk release_files/app-debug.apk
        cp dep-newpipe/build/outputs/apk/debug/dep-newpipe-debug.apk release_files/dep-newpipe.apk
        cp dep-uhm/build/outputs/apk/debug/dep-uhm-debug.apk release_files/dep-uhm.apk
        cp host_hash.txt release_files/host_hash.txt
        cp output_modules/*.dex release_files/
        (cd output_modules && zip -q -j ../release_files/modules.zip *.dex)
        short="$(git rev-parse --short HEAD)"
        notes="Сборка из main, коммит ${short}: $(git log -1 --pretty=%s)"$'\n\n'"app-debug.apk — приложение. modules.zip — все модули одним архивом. Отдельные файлы *.dex — по одному модулю на файл (положить в Загрузки/UniversalPlugins). dep-newpipe.apk, dep-uhm.apk — зависимости (NewPipeExtractor, Uhm): приложение скачивает их само, устанавливать не нужно. host_hash.txt — хэш исходников приложения: по нему приложение узнаёт, нужен ли новый APK."
        gh release delete latest --cleanup-tag --yes 2>/dev/null || true
        gh release create latest release_files/* --target "$GITHUB_SHA" --title "Latest build (${short})" --notes "$notes" --latest
