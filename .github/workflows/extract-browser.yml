name: Extract browser snippets (one-time)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-browser.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Extract tab drag and swipe methods
        continue-on-error: true
        shell: bash
        run: |
          python3 - <<'PY' 2>&1 | tee /tmp/run.log
          import re
          src = open('modules/Browser.java', encoding='utf-8').read()
          lines = src.splitlines(True)
          offs = []
          p = 0
          for l in lines:
              offs.append(p)
              p += len(l)
          WANT = {'dropHint', 'edgeHint', 'zoneOf', 'swipeScroll', 'attachDrop', 'cardAt'}
          SKIP = ('if', 'for', 'while', 'switch', 'catch', 'else', 'try', 'do', 'synchronized', 'new', 'return', '}', '//', '*', '@')

          def match(i):
              d = 0
              n = len(src)
              j = i
              while j < n:
                  c = src[j]
                  if c == '/' and src[j + 1:j + 2] == '/':
                      j = src.find('\n', j)
                      if j < 0:
                          return -1
                      continue
                  if c == '/' and src[j + 1:j + 2] == '*':
                      k = src.find('*/', j + 2)
                      if k < 0:
                          return -1
                      j = k + 2
                      continue
                  if c == '"' or c == "'":
                      q = c
                      j += 1
                      while j < n and src[j] != q:
                          if src[j] == '\\':
                              j += 1
                          j += 1
                      j += 1
                      continue
                  if c == '{':
                      d += 1
                  elif c == '}':
                      d -= 1
                      if d == 0:
                          return j + 1
                  j += 1
              return -1

          found = []
          for idx, l in enumerate(lines):
              s = l.strip()
              if not s.endswith('{') or '(' not in s or ')' not in s or '=' in s.split('(')[0]:
                  continue
              if s.startswith(SKIP):
                  continue
              m = re.match(r'^(?:@\w+\s+)?([\w<>\[\]?, .]+?)\s+(\w+)\s*\(', s)
              if not m or '.' in m.group(1).split()[-1] and False:
                  continue
              name = m.group(2)
              if name in ('if', 'for', 'while', 'switch', 'catch', 'synchronized'):
                  continue
              start = offs[idx] + (len(l) - len(l.lstrip()))
              e = match(offs[idx] + l.rindex('{'))
              if e < 0:
                  continue
              body = src[start:e]
              low = body.lower()
              want = name in WANT
              hit = want or 'swipe' in low or 'свайп' in low or 'startdraganddrop' in low or 'dragshadowbuilder' in low or 'dragevent' in low
              if not hit:
                  continue
              if len(body) > 9000 and not want:
                  continue
              found.append((0 if want else 1, len(body), idx + 1, name, body))
          found.sort(key=lambda x: (x[0], x[1]))
          out = []
          total = 0
          for _, size, line, name, body in found:
              if total + size > 90000:
                  continue
              out.append('// ===== %s (line %d, %d chars) =====\n%s\n' % (name, line, size, body))
              total += size
          head = ['// index of all found methods:']
          for _, size, line, name, _b in sorted(found, key=lambda x: x[2]):
              head.append('//   %d: %s (%d chars)' % (line, name, size))
          open('/tmp/extract.txt', 'w', encoding='utf-8').write('\n'.join(head) + '\n\n' + '\n'.join(out))
          print('methods found:', len(found), 'written chars:', total)
          PY
      - name: Push result to branch extract-log
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          touch /tmp/extract.txt /tmp/run.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B extract-log
          mkdir -p ci
          cp /tmp/extract.txt ci/extract.txt
          cp /tmp/run.log ci/extract-run.log
          git add -f ci/extract.txt ci/extract-run.log
          git commit -m "Extract: tab drag and swipe snippets"
          git push -f origin extract-log
