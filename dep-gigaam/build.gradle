// Зависимость GigaAM (вырезание «эээ» русским распознаванием речи на устройстве). Собирается в APK-контейнер dep-gigaam.apk
// (не устанавливается): хост грузит из него classes.dex и нативные библиотеки (lib/arm64-v8a) через DexClassLoader.
// Распознавание: sherpa-onnx (готовый AAR из релиза проекта, его перед сборкой кладёт в dep-gigaam/libs шаг CI), модель GigaAM v2 CTC
// (русский, int8, около 230 МБ) скачивается при первом запуске в files/gigaam. Классы интерфейсов хоста берутся из :dep-api.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'im.manus.deps.gigaam'
    compileSdk 33

    defaultConfig {
        applicationId "im.manus.deps.gigaam"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
        ndk { abiFilters 'arm64-v8a' }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    kotlinOptions {
        jvmTarget = '11'
    }
    packaging {
        jniLibs {
            // .so остаются в APK без сжатия: загрузчик берёт их прямо из архива (путь вида dep-gigaam.apk!/lib/arm64-v8a)
            useLegacyPackaging = false
        }
    }
}

dependencies {
    compileOnly project(':dep-api')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.1.21'
    implementation files('libs/sherpa-onnx.aar')
}
