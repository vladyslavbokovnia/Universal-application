plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def ciVersionCode = System.getenv('GITHUB_RUN_NUMBER')?.toInteger() ?: 4

android {
    namespace 'im.manus.universalhost'
    compileSdk 33

    defaultConfig {
        applicationId "im.manus.universalhost"
        minSdk 24
        targetSdk 33
        versionCode ciVersionCode
        versionName "1.3"
        // У хоста своей нативной части нет (она у Uhm, а он теперь в dep-uhm.apk); фильтр оставлен, чтобы случайная зависимость не раздувала APK
        ndk { abiFilters 'arm64-v8a' }
    }

    signingConfigs {
        persistentDebug {
            storeFile file("$rootDir/ci/debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
            if (file("$rootDir/ci/debug.keystore").exists()) {
                signingConfig signingConfigs.persistentDebug
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
        // Десахаризация оставлена как была (java.time и другое из Java 11 на minSdk 24); NewPipeExtractor ушёл в dep-newpipe.apk
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '11'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.9.0'
    implementation 'com.google.android.material:material:1.8.0'

    // Профили WebView (раздельные сессии) для модуля Browser; модуль обращается к API через reflection
    implementation 'androidx.webkit:webkit:1.17.1'

    // Клиентская часть Shizuku (сервер — приложение-форк thedjchi/Shizuku, API совместим с оригиналом)
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'

    // Общие интерфейсы хоста и зависимостей. Сами зависимости, NewPipeExtractor (скачивание дорожек YouTube) и Uhm (вырезание «эээ»),
    // в хост больше не входят: это dep-newpipe.apk и dep-uhm.apk из релиза, их грузит Deps (files/deps).
    implementation project(':dep-api')
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'
}
